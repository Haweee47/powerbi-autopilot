name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install tools
        run: |
          pip install jsonschema
          npm install -g @microsoft/powerbi-report-authoring-cli
      - name: Regenerate, build every pilot × theme × language, validate
        run: python tools/check.py --require-validator
