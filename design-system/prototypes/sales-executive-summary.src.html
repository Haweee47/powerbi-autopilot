<title>판매 실적 경영 요약</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* 토큰 — design-system/principles.md 6절. 모든 색은 여기에서만 정의한다 */
  :root {
    color-scheme: light;
    --page: #EEF1F5; --surface: #FFFFFF; --surface-2: #FFFFFF;
    --ink: #14202B; --ink-2: #4A5563; --ink-3: #5A6471;
    --grid: #E4E8ED; --axis: #C6CDD5; --line: rgba(20, 32, 43, .14); --hover: #F3F5F8; --band: #EDF1F6;
    --accent: #2A78D6; --accent-wash: rgba(42, 120, 214, .12); --context: #848E9B; --target: #4A5563;
    --pos: #2A78D6; --neg: #E34948; --pos-ink: #1C5CAB; --neg-ink: #C0392B; --neg-wash: rgba(227, 73, 72, .10);
    --seg-bg: #E1E6EC; --seg-on: #FFFFFF; --seg-shadow: 0 1px 2px rgba(20, 32, 43, .14);
    --tip-shadow: 0 8px 24px rgba(20, 32, 43, .14);
    --radius: 8px;
    --font: "Segoe UI", "Malgun Gothic", "Noto Sans KR", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0E141B; --surface: #16202A; --surface-2: #1E2A36;
      --ink: #EEF2F6; --ink-2: #B4BEC9; --ink-3: #8E99A6;
      --grid: #24303C; --axis: #3A4755; --line: rgba(255, 255, 255, .14); --hover: #1D2935; --band: #1B2631;
      --accent: #3987E5; --accent-wash: rgba(57, 135, 229, .18); --context: #6F7B89; --target: #B4BEC9;
      --pos: #3987E5; --neg: #E66767; --pos-ink: #86B6EF; --neg-ink: #F08A8A; --neg-wash: rgba(230, 103, 103, .14);
      --seg-bg: #16202A; --seg-on: #2A3644; --seg-shadow: none;
      --tip-shadow: 0 8px 24px rgba(0, 0, 0, .45);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0E141B; --surface: #16202A; --surface-2: #1E2A36;
    --ink: #EEF2F6; --ink-2: #B4BEC9; --ink-3: #8E99A6;
    --grid: #24303C; --axis: #3A4755; --line: rgba(255, 255, 255, .14); --hover: #1D2935; --band: #1B2631;
    --accent: #3987E5; --accent-wash: rgba(57, 135, 229, .18); --context: #6F7B89; --target: #B4BEC9;
    --pos: #3987E5; --neg: #E66767; --pos-ink: #86B6EF; --neg-ink: #F08A8A; --neg-wash: rgba(230, 103, 103, .14);
    --seg-bg: #16202A; --seg-on: #2A3644; --seg-shadow: none;
    --tip-shadow: 0 8px 24px rgba(0, 0, 0, .45);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1280px; margin-inline: auto; padding-block: 28px 40px; padding-inline: clamp(16px, 3vw, 32px); display: grid; gap: 24px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  p { margin: 0; }

  /* 헤더 — 좌상단에 가장 무거운 메시지 */
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .eyebrow { font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: .04em; }
  h1 { font-size: 26px; line-height: 1.25; font-weight: 700; margin: 2px 0 10px; letter-spacing: -.01em; }
  .headline { font-size: 16px; font-weight: 600; text-wrap: balance; }
  .subline { font-size: 14px; color: var(--ink-2); margin-top: 4px; }
  .asof { display: grid; justify-items: end; gap: 0; padding: 8px 14px; border-radius: var(--radius); background: var(--surface); }
  .asof span:first-child { font-size: 12px; color: var(--ink-3); }
  .asof span:last-child { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* 필터 — 한 줄, 아래 모든 것에 적용 */
  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
  .seg-group { display: flex; align-items: center; gap: 8px; }
  .seg-label { font-size: 12px; font-weight: 600; color: var(--ink-3); }
  .seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--radius); background: var(--seg-bg); }
  .seg button { font: inherit; font-size: 13px; font-weight: 600; color: var(--ink-2); background: transparent; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-checked="true"] { background: var(--seg-on); color: var(--ink); box-shadow: var(--seg-shadow); }
  .filter-note { margin-left: auto; font-size: 12px; color: var(--ink-3); }

  /* KPI 줄 */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .kpi { background: var(--surface); border-radius: var(--radius); padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .kpi-label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .kpi-value { font-size: clamp(24px, 5.2vw, 32px); line-height: 1.15; font-weight: 700; letter-spacing: -.01em; margin-top: 2px; }
  .kpi-value.muted { color: var(--ink-3); }
  .kpi-delta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; font-size: 13px; color: var(--ink-3); }
  .kpi-foot { margin-top: auto; padding-top: 10px; display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; font-size: 12px; color: var(--ink-3); }
  .kpi-foot .spark { flex: none; }
  .meter { position: relative; height: 8px; margin-top: 22px; border-radius: 4px; background: var(--accent-wash); }
  .meter-fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--accent); }
  .meter-tick { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--ink); }
  .meter-tick span { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  .delta { font-weight: 600; white-space: nowrap; }
  .delta.up { color: var(--pos-ink); }
  .delta.down { color: var(--neg-ink); }
  .delta.flat { color: var(--ink-3); }

  /* 본문 12열 그리드 */
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
  .card { background: var(--surface); border-radius: var(--radius); padding: 20px 20px 16px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .span-trend { grid-column: span 8; } .span-cat { grid-column: span 4; }
  .span-region { grid-column: span 5; } .span-store { grid-column: span 7; }
  .card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px 12px; }
  .card-title { font-size: 16px; line-height: 1.4; font-weight: 600; margin: 0; text-wrap: balance; }
  .card-sub { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
  .btn { font: inherit; font-size: 12px; font-weight: 600; color: var(--ink-2); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--hover); color: var(--ink); }

  /* 추이 차트 */
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--ink-2); }
  .lk { display: inline-flex; align-items: center; gap: 6px; }
  .key { display: inline-block; width: 16px; border-top: 2px solid; }
  .key-now { border-color: var(--accent); } .key-prev { border-color: var(--context); }
  .key-target { border-top: 2px dashed var(--target); }
  .chart { position: relative; min-height: 280px; }
  .chart svg { display: block; overflow: visible; }
  .chart text { font-family: var(--font); font-size: 12px; fill: var(--ink-3); font-variant-numeric: tabular-nums; }
  .chart text.strong { fill: var(--ink); font-weight: 600; }

  /* 카테고리 발산 막대 */
  .clist { display: flex; flex-direction: column; gap: 4px; }
  .crow, .scale { display: grid; grid-template-columns: 84px minmax(0, 1fr) 76px; align-items: center; gap: 10px; }
  .crow { padding: 6px 6px; border-radius: 6px; cursor: default; }
  .crow:hover, .crow:focus-visible { background: var(--hover); }
  .crow-name { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
  .crow-cat { font-size: 14px; font-weight: 600; }
  .crow-sub { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  .track { position: relative; height: 14px; }
  .mid { position: absolute; left: 50%; top: -5px; bottom: -5px; width: 1px; background: var(--axis); }
  .dbar { position: absolute; top: 0; height: 100%; }
  .dbar.pos { background: var(--pos); border-radius: 0 4px 4px 0; }
  .dbar.neg { background: var(--neg); border-radius: 4px 0 0 4px; }
  .crow-val { text-align: right; font-size: 13px; }
  .scale { padding: 0 6px; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .scale-axis { display: flex; justify-content: space-between; }

  /* 권역 막대 */
  .rlist { display: grid; grid-template-columns: 56px minmax(0, 1fr) 64px 76px; align-items: center; gap: 14px 10px; font-size: 13px; }
  .rh { font-size: 12px; font-weight: 600; color: var(--ink-3); }
  .rh.num, .rval, .ryoy { text-align: right; }
  .rname { font-weight: 600; }
  .rtrack { position: relative; height: 14px; }
  .rbar { position: absolute; left: 0; top: 0; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
  .rval { font-variant-numeric: tabular-nums; }

  /* 표 (매장, 추이 표 보기) */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { font-size: 12px; font-weight: 600; color: var(--ink-3); text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  td { padding: 7px 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.gap td { text-align: center; font-size: 12px; color: var(--ink-3); background: var(--hover); padding: 6px; }
  .sname { font-weight: 600; }
  .smeta { display: block; font-size: 12px; font-weight: 400; color: var(--ink-3); }
  .chip { display: inline-block; margin-left: 6px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--neg-ink); background: var(--neg-wash); vertical-align: 1px; }
  .dcell { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
  .mini { position: relative; width: 96px; height: 10px; flex: none; }
  .card-foot { display: flex; justify-content: flex-end; }

  .tooltip { position: fixed; z-index: 10; pointer-events: none; min-width: 168px; padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); box-shadow: var(--tip-shadow); font-size: 12px; }
  .tip-title { font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
  .tip-row { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
  .tip-row strong { font-size: 13px; font-variant-numeric: tabular-nums; }
  .tip-name { color: var(--ink-3); }

  .foot { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--ink-3); }

  @media (max-width: 1099px) {
    .span-trend, .span-store { grid-column: span 12; }
    .span-cat, .span-region { grid-column: span 6; }
  }
  @media (max-width: 899px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 719px) {
    .span-trend, .span-cat, .span-region, .span-store { grid-column: span 12; }
    .filter-note { margin-left: 0; }
  }
  @media (max-width: 440px) {
    .mini { display: none; }
    .card { padding: 16px 14px 14px; }
    .kpi { padding: 14px 14px 12px; }
    .kpi-foot .spark { display: none; }
    .seg button { padding: 6px 10px; }
  }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">경영 요약 · 월간 마감</p>
      <h1>판매 실적</h1>
      <p class="headline" id="headline"></p>
      <p class="subline" id="subline"></p>
    </div>
    <p class="asof"><span>데이터 기준일</span><span>2026.08.31</span></p>
  </header>

  <div class="filters" role="toolbar" aria-label="필터">
    <div class="seg-group">
      <span class="seg-label" id="lbl-period">기간</span>
      <div class="seg" role="radiogroup" aria-labelledby="lbl-period">
        <button type="button" id="period-ytd" role="radio" data-period="ytd" aria-checked="true">1–8월 누계</button>
        <button type="button" id="period-aug" role="radio" data-period="aug" aria-checked="false">8월</button>
      </div>
    </div>
    <div class="seg-group">
      <span class="seg-label" id="lbl-channel">채널</span>
      <div class="seg" role="radiogroup" aria-labelledby="lbl-channel">
        <button type="button" id="channel-all" role="radio" data-channel="전체" aria-checked="true">전체</button>
        <button type="button" id="channel-off" role="radio" data-channel="오프라인" aria-checked="false">오프라인</button>
        <button type="button" id="channel-on" role="radio" data-channel="온라인" aria-checked="false">온라인</button>
      </div>
    </div>
    <p class="filter-note" id="filter-note">비교 기준: 전년 같은 기간</p>
  </div>

  <section class="kpis" id="kpis" aria-label="핵심 지표"></section>

  <section class="grid">
    <article class="card span-trend">
      <div class="card-head">
        <div><h2 class="card-title" id="trend-title"></h2><p class="card-sub" id="trend-sub"></p></div>
        <button type="button" class="btn" id="trend-toggle" aria-pressed="false">표로 보기</button>
      </div>
      <div class="legend" id="trend-legend"></div>
      <div class="chart" id="trend-chart" tabindex="0" aria-describedby="trend-title"></div>
      <div class="table-wrap" id="trend-table" hidden></div>
    </article>

    <article class="card span-cat">
      <div class="card-head">
        <div><h2 class="card-title" id="cat-title"></h2><p class="card-sub" id="cat-sub"></p></div>
      </div>
      <div class="clist" id="cat-list"></div>
    </article>

    <article class="card span-region">
      <div class="card-head">
        <div><h2 class="card-title" id="region-title"></h2><p class="card-sub" id="region-sub"></p></div>
      </div>
      <div class="rlist" id="region-list"></div>
    </article>

    <article class="card span-store">
      <div class="card-head">
        <div><h2 class="card-title" id="store-title"></h2><p class="card-sub" id="store-sub"></p></div>
        <button type="button" class="btn" id="store-toggle" aria-pressed="false"></button>
      </div>
      <div class="table-wrap" id="store-table"></div>
    </article>
  </section>

  <footer class="foot">
    <span>가상 데이터 · 판매 26,194건 (2024.01–2026.08)</span>
    <span>금액은 할인 후 매출, 단위 억·만 원</span>
    <span>목표는 카테고리 × 월 단위로만 정해져 있음</span>
  </footer>
</div>
<div class="tooltip" id="tooltip" role="status" hidden></div>

<script>
  const DATA = __DATA__;
  if (location.hash === "#dark") document.documentElement.dataset.theme = "dark"; // 로컬 캡처용

  const CATS = ["가전", "패션", "식품", "생활용품", "뷰티"];
  const MONTHS12 = ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"];
  const PERIOD_LABEL = { ytd: "1–8월 누계", aug: "8월" };
  const state = { period: "ytd", channel: "전체", storesAll: false, trendTable: false, hoverIndex: null };
  const monthsOf = (p) => (p === "ytd" ? MONTHS12.slice(0, 8) : ["08"]);

  /* ---------- 계산 ---------- */
  function sumMonthly(ch, year, per) {
    const r = [0, 0, 0];
    for (const mm of monthsOf(per)) {
      const v = DATA.monthly[ch][`${year}-${mm}`];
      if (v) { r[0] += v[0]; r[1] += v[1]; r[2] += v[2]; }
    }
    return r;
  }
  function targetOf(per, cat) {
    let t = 0;
    for (const mm of monthsOf(per)) {
      const o = DATA.targetMonthly[`2026-${mm}`] || {};
      for (const c of cat ? [cat] : CATS) t += o[c] || 0;
    }
    return t;
  }
  const growth = (cur, prev) => (prev ? cur / prev - 1 : null);
  function storeRows() {
    const per = state.period;
    return DATA.stores
      .filter((s) => state.channel === "전체" || s.channel === state.channel)
      .map((s) => ({ ...s, cur: s[per + "2026"][0], prev: s[per + "2025"][0], g: growth(s[per + "2026"][0], s[per + "2025"][0]) }));
  }

  /* ---------- 표기 (principles 5절: 억·만, 부호와 기호) ---------- */
  const eok = (v, d = 1) => (v / 1e8).toFixed(d) + "억";
  const man = (v) => Math.round(v / 1e4).toLocaleString("ko-KR");
  const pct = (v, d = 1) => (v * 100).toFixed(d) + "%";
  function hasBatchim(word) {
    const c = word.charCodeAt(word.length - 1);
    return c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 !== 0;
  }
  const josa = (word, withB, withoutB) => word + (hasBatchim(word) ? withB : withoutB);

  function h(tag, props = {}, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    }
    for (const kid of kids.flat()) if (kid != null) e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    return e;
  }
  const NS = "http://www.w3.org/2000/svg";
  function s(tag, attrs = {}) {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    return e;
  }
  function deltaNode(v, unit = "%") {
    const cls = v == null ? "flat" : v > 0.0005 ? "up" : v < -0.0005 ? "down" : "flat";
    const sign = cls === "up" ? "▲" : cls === "down" ? "▼" : "–";
    return h("span", { class: "delta " + cls, text: v == null ? "–" : `${sign} ${Math.abs(v * 100).toFixed(1)}${unit}` });
  }
  const deltaText = (v, unit = "%") => (v == null ? "–" : `${v > 0 ? "▲" : v < 0 ? "▼" : "–"} ${Math.abs(v * 100).toFixed(1)}${unit}`);
  function niceAbs(v) {
    for (const c of [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.4, 0.5, 0.75, 1, 1.5, 2]) if (v <= c) return c;
    return Math.ceil(v);
  }

  /* ---------- 툴팁 (보조 수단: 값은 표·레이블에도 있다) ---------- */
  const tip = document.getElementById("tooltip");
  function showTip(x, y, title, rows) {
    tip.replaceChildren(
      h("p", { class: "tip-title", text: title }),
      ...rows.map((r) => h("div", { class: "tip-row" }, r.key ? h("span", { class: "key key-" + r.key }) : null, r.node || h("strong", { text: r.value }), h("span", { class: "tip-name", text: r.name })))
    );
    tip.hidden = false;
    const pad = 14, w = tip.offsetWidth, ht = tip.offsetHeight;
    let left = x + pad, top = y + pad;
    if (left + w > innerWidth - 8) left = x - w - pad;
    if (top + ht > innerHeight - 8) top = y - ht - pad;
    tip.style.left = Math.max(8, left) + "px";
    tip.style.top = Math.max(8, top) + "px";
  }
  const hideTip = () => { tip.hidden = true; };
  const centerOf = (el) => { const r = el.getBoundingClientRect(); return [r.left + r.width * 0.6, r.top + r.height / 2]; };

  /* ---------- 헤더 인사이트 문장 ---------- */
  function renderHeadline() {
    const { channel: ch, period: per } = state;
    const cur = sumMonthly(ch, 2026, per), prev = sumMonthly(ch, 2025, per);
    const hl = document.getElementById("headline"), sl = document.getElementById("subline");
    if (ch === "전체") {
      const ach = cur[0] / targetOf(per);
      hl.replaceChildren(`${PERIOD_LABEL[per]} 매출 ${eok(cur[0])}, 전년보다 `, deltaNode(growth(cur[0], prev[0])), ` · 목표의 ${pct(ach)}`);
      const rows = CATS.map((c) => ({ c, d: DATA.category["전체"][per]["2026"][c][0] / targetOf(per, c) - 1 }));
      const under = rows.filter((r) => r.d < 0).sort((a, b) => a.d - b.d).map((r) => r.c);
      const over = rows.filter((r) => r.d >= 0).sort((a, b) => b.d - a.d).map((r) => r.c);
      sl.textContent = !under.length ? "모든 카테고리가 목표를 넘었습니다."
        : !over.length ? "모든 카테고리가 목표에 못 미쳤습니다."

  /* ---------- KPI ---------- */
  function spark(values, label) {
    const w = 112, ht = 32, p = 4, min = Math.min(...values), max = Math.max(...values);

    const y = (v) => ht - p - (ht - 2 * p) * (max === min ? 0.5 : (v - min) / (max - min));
    const svg = s("svg", { class: "spark", viewBox: `0 0 ${w} ${ht}`, width: w, height: ht, role: "img", "aria-label": label });
    svg.append(s("polyline", { points: values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" "), fill: "none", stroke: "var(--context)", "stroke-width": 1.5, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    const i = values.length - 1;
    svg.append(s("circle", { cx: x(i), cy: y(values[i]), r: 3.5, fill: "var(--accent)", stroke: "var(--surface)", "stroke-width": 2 }));
    return svg;
  }
  function tile({ label, value, delta, deltaLabel, note, sparkValues, meter, muted }) {
    const foot = h("div", { class: "kpi-foot" }, h("span", { text: note }), sparkValues ? spark(sparkValues, `${label} 최근 12개월 추이`) : null);
    const meterEl = meter == null ? null : h("div", { class: "meter", role: "img", "aria-label": `목표 달성률 ${pct(meter)}` },
      h("div", { class: "meter-fill", style: `width:${(Math.min(meter, 1.2) / 1.2) * 100}%` }),
      h("div", { class: "meter-tick", style: `left:${(1 / 1.2) * 100}%` }, h("span", { text: "목표 100%" })));
    return h("article", { class: "kpi" },
      h("p", { class: "kpi-label", text: label }),
      h("p", { class: "kpi-value" + (muted ? " muted" : ""), text: value }),

  }
  function renderKpis() {
    const { channel: ch, period: per } = state;
    const cur = sumMonthly(ch, 2026, per), prev = sumMonthly(ch, 2025, per);
    const last12 = DATA.months.slice(-12).map((m) => DATA.monthly[ch][m]);
    const pc = cur[0] - cur[1], pp = prev[0] - prev[1];
    const aov = (v) => (v[2] ? v[0] / v[2] : 0);
    const tiles = [
      tile({ label: "매출", value: eok(cur[0]), delta: deltaNode(growth(cur[0], prev[0])), deltaLabel: "전년 대비", note: `전년 ${eok(prev[0])}`, sparkValues: last12.map((v) => v[0]) }),
      tile({ label: "이익", value: eok(pc), delta: deltaNode(growth(pc, pp)), deltaLabel: "전년 대비", note: `이익률 ${pct(pc / cur[0])}`, sparkValues: last12.map((v) => v[0] - v[1]) }),

      tiles.push(tile({ label: "목표 달성률", value: pct(ach), delta: deltaNode(ach - 1, "%p"), deltaLabel: "목표 대비", note: `목표 ${eok(t)} · ${man(Math.abs(gap))}만 원 ${gap < 0 ? "부족" : "초과"}`, meter: ach }));
    } else {
      tiles.push(tile({ label: "목표 달성률", value: "—", note: "목표는 채널별로 정해져 있지 않습니다", muted: true }));
    }
    tiles.push(tile({ label: "객단가", value: (aov(cur) / 1e4).toFixed(1) + "만 원", delta: deltaNode(growth(aov(cur), aov(prev))), deltaLabel: "전년 대비", note: `주문 ${cur[2].toLocaleString("ko-KR")}건`, sparkValues: last12.map(aov) }));
    document.getElementById("kpis").replaceChildren(...tiles);
  }

  /* ---------- 월별 추이: 올해(강조) · 작년(회색) · 목표(점선) ---------- */
  function trendSeries() {
    const ch = state.channel;
    const now = MONTHS12.map((m) => DATA.monthly[ch][`2026-${m}`]?.[0] ?? null);
    const prev = MONTHS12.map((m) => DATA.monthly[ch][`2025-${m}`]?.[0] ?? null);
    const tgt = ch === "전체" ? MONTHS12.map((m) => { const o = DATA.targetMonthly[`2026-${m}`]; return o ? CATS.reduce((a, c) => a + o[c], 0) : null; }) : null;
    return { now, prev, tgt };
  }
  function renderTrend() {
    const { now, prev, tgt } = trendSeries();
    const ch = state.channel;
    const lastIdx = now.reduce((a, v, i) => (v != null ? i : a), 0);
    // 제목은 인사이트 문장 (principles 2절)
    const title = document.getElementById("trend-title");
    if (tgt) {

    } else {
      const above = now.filter((v, i) => v != null && v > prev[i]).length;
      title.textContent = `${ch} 월 매출이 ${lastIdx + 1}개월 중 ${above}개월 전년을 넘었습니다`;
    }
    document.getElementById("trend-sub").textContent = "월 매출, 억 원" + (state.period === "aug" ? " · 음영은 선택한 달" : "");
    const legend = [["now", "2026년 실적"], ["prev", "2025년 실적"]].concat(tgt ? [["target", "2026년 목표"]] : []);
    document.getElementById("trend-legend").replaceChildren(...legend.map(([k, t]) => h("span", { class: "lk" }, h("span", { class: "key key-" + k }), t)));

    const wrap = document.getElementById("trend-chart");
    const W = Math.max(280, wrap.clientWidth), H = 280, m = { l: 48, r: 48, t: 22, b: 30 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const all = [...now, ...prev, ...(tgt || [])].filter((v) => v != null);
    const step = [0.1, 0.2, 0.25, 0.5, 1, 2, 5].map((c) => c * 1e8).find((c) => Math.max(...all) / c <= 4.5) || 1e9;
    const ymax = Math.ceil((Math.max(...all) * 1.04) / step) * step;
    const dec = step >= 1e8 ? 0 : Number.isInteger(step / 1e7) ? 1 : 2;
    const x = (i) => m.l + (iw * i) / 11, y = (v) => m.t + ih * (1 - v / ymax);
    const svg = s("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": title.textContent });

    if (state.period === "aug") svg.append(s("rect", { x: x(7) - iw / 22, y: m.t, width: iw / 11, height: ih, fill: "var(--band)" }));
    for (let v = 0; v <= ymax + 1; v += step) {

      const t = s("text", { x: m.l - 8, y: y(v) + 4, "text-anchor": "end" }); t.textContent = v === 0 ? "0" : (v / 1e8).toFixed(dec) + "억"; svg.append(t);
    }
    const every = iw < 380 ? 2 : 1;
    MONTHS12.forEach((mm, i) => { if (i % every) return; const t = s("text", { x: x(i), y: H - 8, "text-anchor": "middle" }); t.textContent = `${i + 1}월`; svg.append(t); });

    const path = (arr) => { let d = "", pen = false; arr.forEach((v, i) => { if (v == null) { pen = false; return; } d += `${pen ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)} `; pen = true; }); return d; };
    const line = (arr, stroke, extra = {}) => s("path", { d: path(arr), fill: "none", stroke, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round", ...extra });
    svg.append(line(prev, "var(--context)"));
    if (tgt) svg.append(line(tgt, "var(--target)", { "stroke-width": 1.5, "stroke-dasharray": "5 4" }));
    svg.append(line(now, "var(--accent)"));
    // 직접 레이블은 아껴서: 올해 마지막 달 값, 작년 선 끝의 이름

    const endLabel = s("text", { x: x(lastIdx), y: y(now[lastIdx]) - 12, "text-anchor": "middle", class: "strong" }); endLabel.textContent = eok(now[lastIdx], 2); svg.append(endLabel);
    const prevEnd = s("text", { x: x(11) + 8, y: y(prev[11]) + 4 }); prevEnd.textContent = "2025"; svg.append(prevEnd);

    // 십자선 + 툴팁
    const hover = s("g", { visibility: "hidden" });
    const cross = s("line", { y1: m.t, y2: m.t + ih, stroke: "var(--axis)", "stroke-width": 1 });
    const dots = [["now", "var(--accent)"], ["prev", "var(--context)"], ["tgt", "var(--target)"]].map(([k, c]) => s("circle", { r: 4, fill: c, stroke: "var(--surface)", "stroke-width": 2, "data-k": k }));

      h("td", { class: "num", text: now[i] == null ? "–" : eok(now[i], 2) }),
      h("td", { class: "num", text: prev[i] == null ? "–" : eok(prev[i], 2) }),
      tgt ? h("td", { class: "num", text: tgt[i] == null ? "–" : eok(tgt[i], 2) }) : null,
      h("td", { class: "num" }, now[i] == null ? "–" : deltaNode(growth(now[i], prev[i])))));

      h("thead", {}, h("tr", {}, h("th", { text: "월" }), h("th", { class: "num", text: "2026년" }), h("th", { class: "num", text: "2025년" }), tgt ? h("th", { class: "num", text: "목표" }) : null, h("th", { class: "num", text: "전년 대비" }))),

  /* ---------- 카테고리: 목표 대비 차이(%p) 발산 막대 ---------- */

  /* ---------- 권역: 매출 크기 순 막대 (한 가지 색) ---------- */
  function renderRegion() {
    const map = new Map();

    const rows = [...map.values()].map((o) => ({ ...o, g: growth(o.cur, o.prev) })).sort((a, b) => b.cur - a.cur);

        h("td", {}, h("span", { class: "sname", text: r.name }), r.g <= -0.1 ? h("span", { class: "chip", text: "주의" }) : null, h("span", { class: "smeta", text: `${r.region} · ${r.code}` })),

          h("span", { class: "mini", "aria-hidden": "true" }, h("span", { class: "mid" }), h("span", { class: "dbar " + (r.g < 0 ? "neg" : "pos"), style: `${r.g < 0 ? "right" : "left"}:50%;width:${(Math.abs(r.g) / lim) * 50}%` })),
          deltaNode(r.g)))));
    document.getElementById("store-table").replaceChildren(h("table", {},
      h("thead", {}, h("tr", {}, h("th", { text: "매장" }), h("th", { class: "num", text: "매출(만 원)" }), h("th", { class: "num", text: "전년 대비" }))),
      h("tbody", {}, body)));
  }

  /* ---------- 필터 · 전체 렌더 ---------- */
  function renderAll() {
    hideTip();
    document.querySelectorAll("[data-period]").forEach((b) => b.setAttribute("aria-checked", String(b.dataset.period === state.period)));
    document.querySelectorAll("[data-channel]").forEach((b) => b.setAttribute("aria-checked", String(b.dataset.channel === state.channel)));
    renderHeadline(); renderKpis(); renderTrend(); renderCategory(); renderRegion(); renderStores();
  }
  document.querySelectorAll("[data-period]").forEach((b) => b.addEventListener("click", () => { state.period = b.dataset.period; renderAll(); }));
  document.querySelectorAll("[data-channel]").forEach((b) => b.addEventListener("click", () => { state.channel = b.dataset.channel; state.storesAll = false; renderAll(); }));
  document.getElementById("store-toggle").addEventListener("click", () => { state.storesAll = !state.storesAll; renderStores(); });
  document.getElementById("trend-toggle").addEventListener("click", (e) => {
    state.trendTable = !state.trendTable;
    e.currentTarget.setAttribute("aria-pressed", String(state.trendTable));
    e.currentTarget.textContent = state.trendTable ? "차트로 보기" : "표로 보기";
    document.getElementById("trend-table").hidden = !state.trendTable;
    document.getElementById("trend-chart").hidden = state.trendTable;
    document.getElementById("trend-legend").hidden = state.trendTable;
  });
  let raf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(renderTrend); }).observe(document.getElementById("trend-chart"));
  renderAll();
</script>
