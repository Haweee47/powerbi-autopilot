<title>판매 실적 리포트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* 토큰 — design-system/principles.md. 색은 여기에서만 정의한다 */
  :root {
    color-scheme: light;
    --page: #EEF1F5; --surface: #FFFFFF; --surface-2: #FFFFFF;
    --ink: #14202B; --ink-2: #4A5563; --ink-3: #5A6471;
    --grid: #E4E8ED; --axis: #C6CDD5; --line: rgba(20, 32, 43, .14); --hover: #F3F5F8; --band: #EDF1F6;
    --accent: #2A78D6; --accent-wash: rgba(42, 120, 214, .12); --context: #848E9B; --target: #4A5563;
    --pos: #2A78D6; --neg: #E34948; --pos-ink: #1C5CAB; --neg-ink: #C0392B; --neg-wash: rgba(227, 73, 72, .10);
    --seg-bg: #E1E6EC; --seg-on: #FFFFFF; --seg-shadow: 0 1px 2px rgba(20, 32, 43, .14);
    --tip-shadow: 0 8px 24px rgba(20, 32, 43, .14);
    --radius: 8px;
    /* 글자 크기는 5단계만 */
    --fs-cap: 12px; --fs-body: 14px; --fs-title: 16px; --fs-h1: 22px; --fs-kpi: 30px;
    --font: "Segoe UI", "Malgun Gothic", "Noto Sans KR", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0E141B; --surface: #16202A; --surface-2: #1E2A36;
      --ink: #EEF2F6; --ink-2: #B4BEC9; --ink-3: #8E99A6;
      --grid: #24303C; --axis: #3A4755; --line: rgba(255, 255, 255, .14); --hover: #1D2935; --band: #1B2631;
      --accent: #3987E5; --accent-wash: rgba(57, 135, 229, .18); --context: #6F7B89; --target: #B4BEC9;
      --pos: #3987E5; --neg: #E66767; --pos-ink: #86B6EF; --neg-ink: #F08A8A; --neg-wash: rgba(230, 103, 103, .14);
      --seg-bg: #16202A; --seg-on: #2A3644; --seg-shadow: none;
      --tip-shadow: 0 8px 24px rgba(0, 0, 0, .45);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0E141B; --surface: #16202A; --surface-2: #1E2A36;
    --ink: #EEF2F6; --ink-2: #B4BEC9; --ink-3: #8E99A6;
    --grid: #24303C; --axis: #3A4755; --line: rgba(255, 255, 255, .14); --hover: #1D2935; --band: #1B2631;
    --accent: #3987E5; --accent-wash: rgba(57, 135, 229, .18); --context: #6F7B89; --target: #B4BEC9;
    --pos: #3987E5; --neg: #E66767; --pos-ink: #86B6EF; --neg-ink: #F08A8A; --neg-wash: rgba(230, 103, 103, .14);
    --seg-bg: #16202A; --seg-on: #2A3644; --seg-shadow: none;
    --tip-shadow: 0 8px 24px rgba(0, 0, 0, .45);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: var(--fs-body)/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  p { margin: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .app { max-width: 1280px; margin-inline: auto; padding-inline: clamp(16px, 3vw, 32px); padding-block: 0 40px; }

  /* 페이지 선택기 — 모든 페이지 같은 자리 */
  .appbar { position: sticky; top: 0; z-index: 5; background: var(--page); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; padding-block: 16px; border-bottom: 1px solid var(--grid); }
  .brand { font-size: var(--fs-body); font-weight: 700; white-space: nowrap; }
  .brand span { color: var(--ink-3); font-weight: 600; }
  .pages { display: flex; gap: 4px; overflow-x: auto; }
  .pages a { font-size: var(--fs-body); font-weight: 600; color: var(--ink-2); text-decoration: none; padding: 8px 16px; border-radius: var(--radius); white-space: nowrap; }
  .pages a:hover { color: var(--ink); background: var(--hover); }
  .pages a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--seg-shadow); }
  .asof { margin-left: auto; font-size: var(--fs-cap); color: var(--ink-3); white-space: nowrap; }
  .asof strong { color: var(--ink); font-size: var(--fs-body); font-variant-numeric: tabular-nums; margin-left: 4px; }

  .page { display: grid; gap: 24px; padding-top: 24px; }
  .page-head { display: grid; gap: 8px; }
  .eyebrow { font-size: var(--fs-cap); font-weight: 600; color: var(--ink-3); letter-spacing: .04em; }
  h1 { font-size: var(--fs-h1); line-height: 1.3; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  .meta { font-size: var(--fs-body); color: var(--ink-3); }
  .headline { font-size: var(--fs-title); font-weight: 600; text-wrap: balance; }
  .subline { font-size: var(--fs-body); color: var(--ink-2); }
  .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: var(--fs-body); color: var(--ink-3); }
  .crumbs a { color: var(--ink-2); font-weight: 600; text-decoration: none; }
  .crumbs a:hover { color: var(--ink); text-decoration: underline; }

  /* 필터 — 한 줄, 페이지를 옮겨도 유지 */
  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
  .seg-group { display: flex; align-items: center; gap: 8px; }
  .seg-label { font-size: var(--fs-cap); font-weight: 600; color: var(--ink-3); }
  .seg { display: inline-flex; gap: 2px; padding: 4px; border-radius: var(--radius); background: var(--seg-bg); }
  .seg button { font: inherit; font-size: var(--fs-body); font-weight: 600; color: var(--ink-2); background: transparent; border: 0; border-radius: 6px; padding: 4px 12px; cursor: pointer; }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-checked="true"] { background: var(--seg-on); color: var(--ink); box-shadow: var(--seg-shadow); }
  .filter-note { font-size: var(--fs-cap); color: var(--ink-3); }
  .push { margin-left: auto; }
  .btn { font: inherit; font-size: var(--fs-cap); font-weight: 600; color: var(--ink-2); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .btn:hover { background: var(--hover); color: var(--ink); }
  .link { font-size: var(--fs-body); font-weight: 600; color: var(--pos-ink); text-decoration: none; }
  .link:hover { text-decoration: underline; }

  /* KPI */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .kpi { background: var(--surface); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .kpi-label { font-size: var(--fs-body); font-weight: 600; color: var(--ink-2); }
  .kpi-value { font-size: var(--fs-kpi); line-height: 1.2; font-weight: 700; letter-spacing: -.01em; }
  .kpi-value.muted { color: var(--ink-3); }
  .kpi-delta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; font-size: var(--fs-body); color: var(--ink-3); }
  .kpi-foot { margin-top: auto; padding-top: 8px; display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; font-size: var(--fs-cap); color: var(--ink-3); }
  .kpi-foot .spark { flex: none; }
  .meter { position: relative; height: 8px; margin-top: 24px; border-radius: 4px; background: var(--accent-wash); }
  .meter-fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--accent); }
  .meter-tick { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--ink); }
  .meter-tick span { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); font-size: var(--fs-cap); color: var(--ink-3); white-space: nowrap; }
  .delta { font-weight: 600; white-space: nowrap; }
  .delta.up { color: var(--pos-ink); } .delta.down { color: var(--neg-ink); } .delta.flat { color: var(--ink-3); }

  /* 12열 그리드 — 세로 경계선은 페이지 안에서 이어진다 */
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
  .s4 { grid-column: span 4; } .s6 { grid-column: span 6; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }
  .card { background: var(--surface); border-radius: var(--radius); padding: 24px 24px 16px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px 16px; }
  .card-title { font-size: var(--fs-title); line-height: 1.4; font-weight: 600; margin: 0; text-wrap: balance; }
  .card-sub { font-size: var(--fs-cap); color: var(--ink-3); margin-top: 4px; }
  .card-foot { margin-top: auto; display: flex; justify-content: flex-end; }

  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: var(--fs-cap); color: var(--ink-2); }
  .lk { display: inline-flex; align-items: center; gap: 8px; }
  .key { display: inline-block; width: 16px; border-top: 2px solid var(--k, var(--accent)); }
  .key.dash { border-top-style: dashed; }
  .chart { position: relative; }
  .chart svg { display: block; overflow: visible; }
  .chart text { font-family: var(--font); font-size: var(--fs-cap); fill: var(--ink-3); font-variant-numeric: tabular-nums; }
  .chart text.strong { fill: var(--ink); font-weight: 600; }

  /* 발산 막대 목록 */
  .clist { display: flex; flex-direction: column; gap: 4px; }
  .crow, .scale { display: grid; grid-template-columns: 88px minmax(0, 1fr) 80px; align-items: center; gap: 8px; }
  .crow { padding: 8px; border-radius: 6px; }
  .crow[role="link"] { cursor: pointer; }
  .crow:hover, .crow:focus-visible { background: var(--hover); }
  .crow-name { display: flex; flex-direction: column; line-height: 1.35; min-width: 0; }
  .crow-cat { font-size: var(--fs-body); font-weight: 600; }
  .crow-sub { font-size: var(--fs-cap); color: var(--ink-3); white-space: nowrap; }
  .track { position: relative; height: 16px; }
  .mid { position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--axis); }
  .dbar { position: absolute; top: 0; height: 100%; }
  .dbar.pos { background: var(--pos); border-radius: 0 4px 4px 0; }
  .dbar.neg { background: var(--neg); border-radius: 4px 0 0 4px; }
  .crow-val { text-align: right; font-size: var(--fs-body); }
  .scale { padding: 0 8px; font-size: var(--fs-cap); color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .scale-axis { display: flex; justify-content: space-between; }

  /* 가로 막대 (한 가지 색) */
  .rlist { display: grid; grid-template-columns: 64px minmax(0, 1fr) 72px 80px; align-items: center; gap: 12px 8px; font-size: var(--fs-body); }
  .rh { font-size: var(--fs-cap); font-weight: 600; color: var(--ink-3); }
  .rh.num, .rval, .ryoy { text-align: right; }
  .rname { font-weight: 600; }
  .rtrack { position: relative; height: 16px; }
  .rbar { position: absolute; left: 0; top: 0; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
  .rbar.ctx { background: var(--context); }
  .rval { font-variant-numeric: tabular-nums; }

  /* 작은 여러 차트 */
  .sm-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
  .sm { min-width: 0; display: grid; gap: 4px; }
  .sm-name { font-size: var(--fs-body); font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }

  /* 주의 목록 */
  .watch { display: grid; }
  .witem { display: grid; gap: 2px; padding: 12px 0; border-bottom: 1px solid var(--grid); }
  .witem:first-child { padding-top: 0; }
  .witem-top { display: flex; justify-content: space-between; gap: 8px; }
  .witem a { font-weight: 600; color: var(--ink); text-decoration: none; }
  .witem a:hover { text-decoration: underline; }
  .witem p { font-size: var(--fs-cap); color: var(--ink-3); }
  .empty { font-size: var(--fs-body); color: var(--ink-3); }

  /* 표 */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: var(--fs-body); }
  th { font-size: var(--fs-cap); font-weight: 600; color: var(--ink-3); text-align: left; padding: 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  td { padding: 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th .sort { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  th .sort:hover { color: var(--ink); }
  tr.gap td { text-align: center; font-size: var(--fs-cap); color: var(--ink-3); background: var(--hover); padding: 4px; }
  tr.drill { cursor: pointer; }
  tr.drill:hover, tr.drill:focus-visible { background: var(--hover); }
  tr.total td { font-weight: 600; border-bottom: 0; }
  .sname { font-weight: 600; }
  .smeta { display: block; font-size: var(--fs-cap); font-weight: 400; color: var(--ink-3); }
  .chip { display: inline-block; margin-left: 8px; padding: 0 8px; border-radius: 999px; font-size: var(--fs-cap); font-weight: 600; color: var(--neg-ink); background: var(--neg-wash); vertical-align: 1px; }
  .dcell { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .mini { position: relative; width: 96px; height: 10px; flex: none; }
  .go { color: var(--ink-3); font-size: var(--fs-cap); white-space: nowrap; }

  .tooltip { position: fixed; z-index: 10; pointer-events: none; min-width: 176px; max-width: 280px; padding: 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); box-shadow: var(--tip-shadow); font-size: var(--fs-cap); }
  .tip-title { font-weight: 600; font-size: var(--fs-body); margin-bottom: 4px; }
  .tip-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .tip-row strong { font-size: var(--fs-body); font-variant-numeric: tabular-nums; }
  .tip-name { color: var(--ink-3); }
  .tip-chart { margin-top: 8px; }
  .tip-chart text { font-family: var(--font); font-size: var(--fs-cap); fill: var(--ink-3); }

  .foot { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: var(--fs-cap); color: var(--ink-3); padding-top: 24px; }

  @media (max-width: 1099px) {
    .s4, .s6, .s8 { grid-column: span 12; }
    .sm-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 899px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 719px) {
    .sm-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .push { margin-left: 0; }
    .asof { margin-left: 0; width: 100%; }
  }
  @media (max-width: 440px) {
    .mini, .kpi-foot .spark, .hide-sm { display: none; }
    .card { padding: 16px; }
    .seg button { padding: 4px 8px; }
  }
</style>

      h("div", { class: "track" }, h("span", { class: "mid" }), h("span", { class: "dbar " + (r.v < 0 ? "neg" : "pos"), style: `${r.v < 0 ? "right" : "left"}:50%;width:${(Math.abs(r.v) / mlim) * 50}%` })),
      h("span", { class: "crow-val" }, deltaNode(r.v, "%p")))));
  }

  /* =====================================================================
     페이지 3 · 매장 (비교: 어느 매장이 뒤처지나)
     ===================================================================== */
  function pageStores(root) {
    const per = state.period;
    root.append(pageHead({ eyebrow: "비교 · 매장", title: "매장별 성과" }), filterBar());
    const rows = storeRows(), down = rows.filter((r) => r.g < 0), worst = rows.slice().sort((a, b) => a.g - b.g)[0];
    setTitle("headline", `${rows.length}개 매장 중 ${down.length}곳이 전년보다 줄었습니다`, ...(worst.g < 0 ? [" — 가장 큰 곳은 ", worst.name, " ", deltaNode(worst.g)] : []));
    setTitle("subline", `${state.channel === "전체" ? "전체 채널" : state.channel} · ${PERIOD_LABEL[per]} · 점이나 행을 누르면 매장 상세로 들어갑니다.`);
    const grid = h("section", { class: "grid" },
      card("s8", { titleId: "scatter-title", sub: "가로 = 매출 규모, 세로 = 전년 대비 · 점을 누르면 상세", legend: legendOf([["전년보다 늘어난 매장", "var(--accent)"], ["줄어든 매장", "var(--neg)"]]) }, h("div", { class: "chart", id: "scatter" })),
      card("s4", { titleId: "watch-title", sub: "전년보다 10% 넘게 줄어든 매장과 가장 크게 줄어든 카테고리" }, h("div", { class: "watch", id: "watch" })),
      card("s12", { titleId: "rank-title", sub: `${PERIOD_LABEL[per]} · 머리글을 누르면 정렬 · 행을 누르면 상세` }, h("div", { class: "table-wrap", id: "rank" })));
    root.append(grid);

    // 산점도: 규모 × 성장률, 극단값만 이름표
    const med = rows.map((r) => r.cur).sort((a, b) => a - b)[Math.floor(rows.length / 2)];
    const bigDown = rows.filter((r) => r.cur >= med && r.g < 0).length;
    setTitle("scatter-title", bigDown ? `규모가 큰 매장 중 ${bigDown}곳이 줄고 있습니다` : "규모가 큰 매장은 모두 늘고 있습니다");
    scatter(document.getElementById("scatter"), rows, med);

    // 주의 목록
    const watch = rows.filter((r) => r.g <= -0.1).sort((a, b) => a.g - b.g);
    setTitle("watch-title", watch.length ? `주의 매장 ${watch.length}곳` : "주의 매장이 없습니다");
    document.getElementById("watch").replaceChildren(...(watch.length ? watch.map((r) => { const wc = storeWorstCat(r); return h("div", { class: "witem" },
      h("div", { class: "witem-top" }, h("a", { href: `#/store/${r.code}`, text: r.name }), deltaNode(r.g)),
      h("p", { text: `${r.region} · 매출 ${man(r.cur)}만 원 · 가장 크게 준 카테고리: ${wc.c} (${deltaText(wc.g)})` })); }) : [h("p", { class: "empty", text: "10% 넘게 줄어든 매장이 없습니다." })]));

    // 순위표 (정렬 가능)
    const { key, dir } = state.sort;
    const sorted = rows.slice().sort((a, b) => (key === "name" ? a.name.localeCompare(b.name, "ko") : (a[key] ?? 0) - (b[key] ?? 0)) * dir);
    setTitle("rank-title", `매장 ${rows.length}곳 전체 · ${key === "g" ? "전년 대비" : key === "cur" ? "매출" : key === "margin" ? "이익률" : key === "aov" ? "객단가" : "이름"} ${dir > 0 ? "낮은" : "높은"} 순`);
    document.getElementById("rank").replaceChildren(storeTable(sorted, niceAbs(Math.max(...rows.map((r) => Math.abs(r.g)))), { sortable: true }));
  }

  function scatter(wrap, rows, med) {
    const W = Math.max(280, wrap.clientWidth), H = 376, m = { l: 56, r: 24, t: 32, b: 40 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
    const xt = niceTicks(0, Math.max(...rows.map((r) => r.cur)), 4), lim = niceAbs(Math.max(...rows.map((r) => Math.abs(r.g))));
    const x = (v) => m.l + (iw * v) / xt[xt.length - 1], y = (g) => m.t + ih * (0.5 - g / (2 * lim));
    const svg = s("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "매장별 매출 규모와 전년 대비 산점도" });
    for (const g of [-lim, -lim / 2, 0, lim / 2, lim]) {
      svg.append(s("line", { x1: m.l, x2: m.l + iw, y1: y(g), y2: y(g), stroke: g === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1, "shape-rendering": "crispEdges" }));
      svg.append(s("text", { x: m.l - 8, y: y(g) + 4, "text-anchor": "end" }, g === 0 ? "0" : `${g > 0 ? "+" : "−"}${Math.round(Math.abs(g) * 100)}%`));
    }
    for (const t of xt) svg.append(s("text", { x: x(t), y: H - 16, "text-anchor": t === 0 ? "start" : "middle" }, t === 0 ? "0" : man(t) + "만"));
    svg.append(s("line", { x1: x(med), x2: x(med), y1: m.t, y2: m.t + ih, stroke: "var(--axis)", "stroke-width": 1 }));
    svg.append(s("text", { x: x(med), y: m.t - 12, "text-anchor": "middle" }, "매출 중앙값")); // 점 이름표와 겹치지 않게 그림 위쪽 여백에
    const corner = (tx, ty, anchor, t) => svg.append(s("text", { x: tx, y: ty, "text-anchor": anchor }, t));
    corner(m.l + iw, m.t + 12, "end", "크고 성장"); corner(m.l + iw, m.t + ih - 8, "end", "크지만 감소");
    // 극단값 이름표: 가장 낮은 3곳, 가장 높은 2곳
    const byG = rows.slice().sort((a, b) => a.g - b.g), labeled = new Set([...byG.slice(0, 3), ...byG.slice(-2)].map((r) => r.code));
    for (const r of rows) {
      const cx = x(r.cur), cy = y(r.g), color = r.g < 0 ? "var(--neg)" : "var(--accent)";
      svg.append(s("circle", { cx, cy, r: 5, fill: color, stroke: "var(--surface)", "stroke-width": 2 }));
      if (labeled.has(r.code)) { const right = cx < m.l + iw * 0.72; svg.append(s("text", { x: cx + (right ? 10 : -10), y: cy + 4, "text-anchor": right ? "start" : "end", class: "strong" }, `${r.name} ${deltaText(r.g)}`)); }
      const hit = s("circle", { cx, cy, r: 14, fill: "transparent", tabindex: "0", role: "link", "aria-label": `${r.name} ${deltaText(r.g)} 상세 보기`, style: "cursor:pointer" });
      const series = [{ values: M12.map((mm) => r.monthly[`2025-${mm}`]?.[0] ?? null), color: "var(--context)" }, { values: M12.map((mm) => r.monthly[`2026-${mm}`]?.[0] ?? null), color: "var(--accent)" }];
      const tipIt = (tx, ty) => showTip(tx, ty, r.name, [{ value: man(r.cur) + "만 원", name: "매출" }, { node: deltaNode(r.g), name: "전년 대비" }, { value: r.margin == null ? "–" : pct(r.margin), name: "이익률" }, { value: `${r.region} · ${r.channel}`, name: "" }], tipChart(series, "money"));
      hit.addEventListener("pointermove", (e) => tipIt(e.clientX, e.clientY)); hit.addEventListener("pointerleave", hideTip);
      hit.addEventListener("focus", () => { const b = hit.getBoundingClientRect(); tipIt(b.right, b.top); }); hit.addEventListener("blur", hideTip);
      hit.addEventListener("click", () => go(`#/store/${r.code}`)); hit.addEventListener("keydown", (e) => { if (e.key === "Enter") go(`#/store/${r.code}`); });
      svg.append(hit);
    }
    wrap.replaceChildren(svg);
  }

  /* =====================================================================
     페이지 4 · 매장 상세 (드릴스루 대상 — 탭에는 없다)
     ===================================================================== */
  function pageStore(root, code) {
    const st = DATA.stores.find((x) => x.code === code);
    if (!st) { go("#/stores"); return; }
    const per = state.period, all = storeRows("전체"), me = all.find((r) => r.code === code);
    const rank = all.slice().sort((a, b) => b.g - a.g).findIndex((r) => r.code === code) + 1;
    const back = h("a", { class: "btn", href: "#/stores", onclick: (e) => { if (state.prevRoute && state.prevRoute.page !== "store") { e.preventDefault(); history.back(); } }, text: "← 돌아가기" });
    const crumbs = h("nav", { class: "crumbs", "aria-label": "경로" }, back, h("a", { href: "#/stores", text: "매장" }), h("span", { text: "›" }), h("span", { "aria-current": "page", text: st.name }));
    root.append(pageHead({ eyebrow: "상세 · 매장", title: st.name, meta: `${st.region} · ${st.province} · ${st.channel} · ${st.opened.slice(0, 7).replace("-", ".")} 개점 · ${st.code}`, crumbs }),
      filterBar({ channel: false, note: "매장 한 곳의 상세라 채널 필터는 쓰지 않습니다" }));
    setTitle("headline", `${PERIOD_LABEL[per]} 매출 ${man(me.cur)}만 원, 전년보다 `, deltaNode(me.g), ` · 성장률 ${all.length}곳 중 ${rank}위`);
    const wc = storeWorstCat(st);
    setTitle("subline", wc.d < 0 ? `가장 크게 줄어든 카테고리는 ${wc.c}(${deltaText(wc.g)}, ${man(Math.abs(wc.d))}만 원 감소)입니다.` : "모든 카테고리가 전년보다 늘었습니다.");

    const a = storeAgg(st, per, "2026"), b = storeAgg(st, per, "2025"), last12 = DATA.months.slice(-12).map((mm) => st.monthly[mm] || [0, 0]);
    const aov = (x) => (x.orders ? x.rev / x.orders : 0);
    root.append(h("section", { class: "kpis", "aria-label": "매장 핵심 지표" },
      tile({ label: "매출", value: man(a.rev) + "만 원", delta: deltaNode(growth(a.rev, b.rev)), deltaLabel: "전년 대비", note: `전년 ${man(b.rev)}만 원`, sparkValues: last12.map((v) => v[0]) }),
      tile({ label: "이익률", value: pct((a.rev - a.cost) / a.rev), delta: deltaNode((a.rev - a.cost) / a.rev - (b.rev - b.cost) / b.rev, "%p"), deltaLabel: "전년 대비", note: `이익 ${man(a.rev - a.cost)}만 원` }),
      tile({ label: "주문", value: a.orders.toLocaleString("ko-KR") + "건", delta: deltaNode(growth(a.orders, b.orders)), deltaLabel: "전년 대비", note: `전년 ${b.orders.toLocaleString("ko-KR")}건`, sparkValues: last12.map((v) => v[1]) }),
      tile({ label: "객단가", value: (aov(a) / 1e4).toFixed(1) + "만 원", delta: deltaNode(growth(aov(a), aov(b))), deltaLabel: "전년 대비", note: "주문당 평균 매출" })));

    const peers = DATA.category[st.channel][per]["2026"], peerTot = CATS.reduce((s2, c) => s2 + peers[c][0], 0);
    const mixNow = st.mix[per]["2026"], mixPrev = st.mix[per]["2025"], meTot = CATS.reduce((s2, c) => s2 + mixNow[c][0], 0);
    const grid = h("section", { class: "grid" },
      card("s6", { titleId: "st-trend-title", sub: "월 매출, 만 원", legend: legendOf([["2026년", "var(--accent)"], ["2025년", "var(--context)"]]) }, h("div", { class: "chart", id: "st-trend" })),
      card("s6", { titleId: "st-mix-title", sub: `카테고리 구성비 · ${PERIOD_LABEL[per]} · 파랑 = 이 매장, 회색 = ${st.channel} 전체` }, h("div", { class: "rlist", id: "st-mix" })));
    root.append(grid);
    const now = M12.map((mm) => st.monthly[`2026-${mm}`]?.[0] ?? null), prv = M12.map((mm) => st.monthly[`2025-${mm}`]?.[0] ?? null);
    setTitle("st-trend-title", `8개월 중 ${now.filter((v, i) => v != null && v < prv[i]).length}개월이 전년보다 낮았습니다`);
    lineChart(document.getElementById("st-trend"), { kind: "money", band: per === "aug" ? 7 : null, series: [{ label: "2026년", values: now, color: "var(--accent)" }, { label: "2025년", values: prv, color: "var(--context)", endName: "2025" }],
      fmtTip: (v) => man(v) + "만 원", fmtEnd: (v) => man(v) + "만", aria: `${st.name} 월 매출`, extraRows: (i) => (now[i] != null ? [{ node: deltaNode(growth(now[i], prv[i])), name: "전년 대비" }] : []) });
    // 구성비: 매장(파랑) vs 같은 채널 전체(회색), 오른쪽에 매장의 카테고리별 전년 대비
    const rows = CATS.map((c) => ({ c, me: mixNow[c][0] / meTot, peer: peers[c][0] / peerTot, g: growth(mixNow[c][0], mixPrev[c][0]) })).sort((x, y) => y.me - x.me);
    const top = rows.slice().sort((x, y) => (y.me - y.peer) - (x.me - x.peer))[0];
    setTitle("st-mix-title", `${josa(top.c, "의", "의")} 비중이 ${st.channel} 평균보다 ${Math.abs((top.me - top.peer) * 100).toFixed(1)}%p ${top.me >= top.peer ? "높습니다" : "낮습니다"}`);
    const mx = Math.max(...rows.flatMap((r) => [r.me, r.peer]));
    document.getElementById("st-mix").replaceChildren(h("span", { class: "rh", text: "카테고리" }), h("span", { class: "rh", text: "구성비" }), h("span", { class: "rh num", text: "이 매장" }), h("span", { class: "rh num", text: "전년 대비" }),
      ...rows.flatMap((r) => [h("span", { class: "rname", text: r.c }),
        h("div", { style: "display:grid;gap:2px", role: "img", "aria-label": `${r.c} 이 매장 ${pct(r.me)}, ${st.channel} 전체 ${pct(r.peer)}` },
          h("div", { class: "rtrack", style: "height:10px" }, h("span", { class: "rbar", style: `width:${(r.me / mx) * 100}%` })),
          h("div", { class: "rtrack", style: "height:6px" }, h("span", { class: "rbar ctx", style: `width:${(r.peer / mx) * 100}%` }))),
        h("span", { class: "rval", text: pct(r.me) }), h("span", { class: "ryoy" }, deltaNode(r.g))]));
  }

  /* ---------- 라우터 (페이지 선택기 + 드릴스루) ---------- */
  const PAGES = { summary: pageSummary, category: pageCategory, stores: pageStores, store: pageStore };
  const TITLES = { summary: "요약", category: "카테고리", stores: "매장", store: "매장 상세" };
  function parseHash() { const mt = location.hash.match(/^#\/(\w+)(?:\/([\w-]+))?/); return mt && PAGES[mt[1]] ? { page: mt[1], arg: mt[2] } : { page: "summary" }; }
  function render() {
    hideTip();
    const r = state.route, root = document.getElementById("page");
    root.replaceChildren();
    PAGES[r.page](root, r.arg);
    const navKey = r.page === "store" ? "stores" : r.page;
    document.querySelectorAll("[data-nav]").forEach((a) => { if (a.dataset.nav === navKey) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    document.title = `${r.page === "store" ? (DATA.stores.find((x) => x.code === r.arg)?.name || "") + " · " : ""}${TITLES[r.page]} · 판매 실적 리포트`;
  }
  function route() { state.prevRoute = state.route; state.route = parseHash(); render(); window.scrollTo(0, 0); }
  addEventListener("hashchange", route);
  let lastW = 0, raf = 0;
  new ResizeObserver((es) => { const w = Math.round(es[0].contentRect.width); if (w !== lastW) { const first = !lastW; lastW = w; if (!first) { cancelAnimationFrame(raf); raf = requestAnimationFrame(render); } } }).observe(document.getElementById("page"));
  state.route = parseHash();
  render();
</script>
